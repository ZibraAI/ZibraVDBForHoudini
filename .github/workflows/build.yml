name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  select-houdini-build:
    name: Select houdini build
    runs-on: [self-hosted, Linux, X64]
    outputs:
      need-run: ${{ steps.pr_check.outputs.has_open_pr != 'true' }}
      need-build-macos: ${{ (steps.pr_check.outputs.has_open_pr != 'true') && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.ref_type == 'tag') }}
      is-release: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      # Legend
      # name - Human readable OS/Arch name. Version is appended separately.
      # os - Runner OS. Used for workflow logic.
      # runner - Github actions runner that should run the job
      # generator - Generator used for cmake configuration
      # houdini-version - Version of houdini to build against (e.g. "20.5"/"21.0")
      # houdini-build - Specific build of houdini to build against (e.g. "440")
      # houdini-install-path - Path into which houdini gets installed. This needs to be consistent with houdini install script, as it calculates path for previous version when removing it. On Windows it MUST USE BACKSLASHES.
      # hfs-path - Path to use HFS env var to. This is same as houdini-install-path on most platforms, but macOS is special and required additional suffix after houdini-install-path.
      # python-version - Python version to install (e.g. "3.11"). Only used on Windows right now.
      # python-command - Python command to use for running scripts (e.g. "python"/"python3")
      # python-venv-activate-path - Path to powershell python venv activation script within venv folder
      # additional-config-args - Additional commad line args to pass to cmake configuration. Required on macOS to specify architectrue (arm64/x64)
      build-matrix-json: ${{ steps.build_matrix.outputs.build_matrix }}

    steps:
      - name: Check for open PRs
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        id: pr_check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`,
            });
            core.setOutput('has_open_pr', String(prs.data.length > 0));

      - name: Sync
        if: ${{ steps.pr_check.outputs.has_open_pr != 'true' }}
        uses: actions/checkout@v7

      - name: Build matrix
        if: ${{ steps.pr_check.outputs.has_open_pr != 'true' }}
        id: build_matrix
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          python3 -m venv actions/houdini/venv
          ./actions/houdini/venv/bin/Activate.ps1
          pip3 install -r actions/houdini/requirements.txt
          python3 actions/houdini/build_matrix.py --all-platforms ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag') && '--all-builds' || '' }} ${{ (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.ref_type == 'tag') && '--all-versions' || '' }}
        env:
          HOUDINI_CLIENT_ID: ${{ secrets.HOUDINI_CLIENT_ID }}
          HOUDINI_SECRET_KEY: ${{ secrets.HOUDINI_SECRET_KEY }}

  build-plugin:
    needs: select-houdini-build
    if: ${{ (needs.select-houdini-build.outputs.need-run == 'true') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-houdini-build.outputs.build-matrix-json) }}
            
    runs-on: ${{ matrix.runner }}
    environment: ${{ needs.select-houdini-build.outputs.is-release == 'true' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    concurrency:
      group: ${{ matrix.houdini-platform }}-${{ matrix.houdini-version }}-${{ matrix.houdini-build }}-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    name: Build ${{ matrix.name }}

    steps:
      - name: Sync
        uses: actions/checkout@v7

      - name: Install python
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          winget install Python.Python.${{ matrix.python-version }} -e -s winget --custom Include_debug=1
          if ($LASTEXITCODE -eq -1978335189) # APPINSTALLER_CLI_ERROR_UPDATE_NOT_APPLICABLE
          {
            # If Python is already installed, report success
            exit 0
          }

      - name: Check if Houdini is installed
        id: install-check
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          ${{ matrix.python-command }} actions/houdini/is_installed.py --version ${{ matrix.houdini-version }} --build ${{ matrix.houdini-build }} --platform ${{ matrix.houdini-platform }} --install-path ${{ matrix.houdini-install-path }}

      - name: Install Houdini
        if: ${{ steps.install-check.outputs.need_install_houdini == 'true' }}
        working-directory: ${{ github.workspace }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          ${{ matrix.python-command }} -m venv actions/houdini/venv
          ./actions/houdini/venv/${{ matrix.python-venv-activate-path }}
          ${{ matrix.python-command }} -m pip install -r actions/houdini/requirements.txt
          ${{ matrix.python-command }} actions/houdini/install_houdini.py --version ${{ matrix.houdini-version }} --build ${{ matrix.houdini-build }} --platform ${{ matrix.houdini-platform }} --install-path ${{ matrix.houdini-install-path }}
        env:
          HOUDINI_CLIENT_ID: ${{ secrets.HOUDINI_CLIENT_ID }}
          HOUDINI_SECRET_KEY: ${{ secrets.HOUDINI_SECRET_KEY }}

      - name: Configure Cmake
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DZIBRAVDB_OUTPUT_PATH="${{ github.workspace }}/package" ${{ matrix.additional-config-args }}
        env:
          HFS: ${{ matrix.hfs-path }}

      - name: Build Debug
        working-directory: ${{ github.workspace }}
        shell: pwsh
        # Need to delete all generated artifacts, so Ninja Multi-Config does not get tripped up by existing artifacts when building Release
        run: |
          cmake --build build --config Debug
          Remove-Item -Recurse -Force "${{ github.workspace }}/package"

      - name: Build Release
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: cmake --build build --config Release

      - name: Find binaries to sign
        if: ${{ needs.select-houdini-build.outputs.is-release == 'true' && matrix.os == 'windows' }}
        id: find_binaries
        shell: pwsh
        run: |
          $Binaries = @()
          foreach ($Name in @("ZibraVDBForHoudini.dll", "ZibraVDBResolver.dll"))
          {
            $Found = @(Get-ChildItem -Path "${{ github.workspace }}/package/ZibraVDB" -Recurse -File -Filter $Name)
            if ($Found.Count -ne 1)
            {
              Write-Error "Expected exactly 1 $Name in package, found $($Found.Count)"
              exit 1
            }
            Write-Output "Binary to sign: $($Found[0].FullName)"
            $Binaries += $Found[0].FullName
          }
          "paths=$($Binaries -join ',')" >> $env:GITHUB_OUTPUT

      - name: Azure login
        if: ${{ needs.select-houdini-build.outputs.is-release == 'true' && matrix.os == 'windows' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # Signing only needs a token for the Artifact Signing
          allow-no-subscriptions: true

      - name: Sign binaries with Azure Artifact Signing
        if: ${{ needs.select-houdini-build.outputs.is-release == 'true' && matrix.os == 'windows' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          # Comma separated list of files
          files: ${{ steps.find_binaries.outputs.paths }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # The self-hosted runner keeps the signing tools installed between runs
          cache-dependencies: false
          # Use only the azure/login session (OIDC), skip every other credential type.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signatures
        if: ${{ needs.select-houdini-build.outputs.is-release == 'true' && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          $Failed = $false
          foreach ($Binary in "${{ steps.find_binaries.outputs.paths }}".Split(','))
          {
            $Sig = Get-AuthenticodeSignature $Binary
            Write-Host "File: $Binary"
            Write-Host "  Status: $($Sig.Status)"
            Write-Host "  Signer: $($Sig.SignerCertificate.Subject)"
            Write-Host "  Timestamp: $($Sig.TimeStamperCertificate.Subject)"
            if ($Sig.Status -ne 'Valid')
            {
              Write-Error "Signature is not valid for $($Binary): $($Sig.StatusMessage)" -ErrorAction Continue
              $Failed = $true
            }
          }
          if ($Failed) { exit 1 }

      - name: Save artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ZibraVDBForHoudini-${{ matrix.houdini-version }}.${{ matrix.houdini-build }}-${{ matrix.houdini-platform }}
          path: package
          if-no-files-found: error
          retention-days: 7

  merge-packages:
    runs-on: [self-hosted, macOS, ARM64]
    needs: [select-houdini-build, build-plugin]
    # Only run merge if there is more than one build in matrix
    if: ${{ fromJson(needs.select-houdini-build.outputs.build-matrix-json).include[1] != null }}
    name: Merge packages ${{ needs.select-houdini-build.outputs.is-release == 'true' && '(Release)' || (github.event_name == 'pull_request' && '(PR)' || (github.event_name == 'workflow_dispatch' &&' (Workflow Dispatch)' || ' (Push)')) }}

    steps:
      - name: Sync
        uses: actions/checkout@v7
        
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ZibraVDBForHoudini-*

      - name: Sign and notarize apple binaries
        shell: bash
        if: ${{ needs.select-houdini-build.outputs.need-build-macos == 'true' }}
        run: |
          pwsh ${{ github.workspace }}/actions/houdini/notarize_macos_packages.ps1 "ZibraVDBForHoudini-"
        env:
          DEVELOPER_ID_APPLICATION_CERT: ${{ secrets.DEVELOPER_ID_APPLICATION_ZIBRA_AI_CERT }}
          DEVELOPER_ID_APPLICATION_PASS: ${{ secrets.DEVELOPER_ID_APPLICATION_ZIBRA_AI_PASS }}
          DEVELOPER_ID_APPLICATION_NAME: ${{ secrets.DEVELOPER_ID_APPLICATION_ZIBRA_AI_NAME }}
          APPLE_DEVELOPER_TEAM: ${{ secrets.APPLE_DEVELOPER_ZIBRA_AI_TEAM }}
          NOTARIZATION_USER: ${{ secrets.NOTARIZATION_ZIBRA_AI_USER }}
          NOTARIZATION_PASS: ${{ secrets.NOTARIZATION_ZIBRA_AI_PASS }}

      - name: Merge packages
        shell: bash
        run: |
          pwsh ${{ github.workspace }}/actions/houdini/merge_packages.ps1 -Prefix "ZibraVDBForHoudini-" -DestFolder "merged"

      # Release package name must not match "ZibraVDBForHoudini-*", otherwise it gets removed by "Delete partial artifacts"
      - name: Save merged packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.select-houdini-build.outputs.is-release == 'true' && format('ZibraVDBForHoudini_{0}', github.ref_name) || 'ZibraVDBForHoudini' }}
          path: merged
          if-no-files-found: error
          retention-days: ${{ needs.select-houdini-build.outputs.is-release == 'true' && 90 || 28 }}

      - name: Delete partial artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          name: ZibraVDBForHoudini-*
